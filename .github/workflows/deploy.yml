name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set last updated date
        run: |
          EN_DATE=$(TZ=Asia/Shanghai date '+%B %-d, %Y')
          ZH_DATE=$(TZ=Asia/Shanghai date '+%Y年%-m月%-d日')
          sed -i "s/^last_updated = \".*\"/last_updated = \"$EN_DATE\"/" content/config.toml
          sed -i "s/^last_updated = \".*\"/last_updated = \"$ZH_DATE\"/" content_zh/config.toml
          echo "content/config.toml -> $EN_DATE"
          echo "content_zh/config.toml -> $ZH_DATE"

      - name: Build
        run: npx next build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
