content = "基于约 12 万例胸部 CT 数据，构建融合 CT 解剖特性的 JEPA 世界基座模型，并结合连续思维机解耦建模 pipeline，在多个下游任务上达到 SOTA。拟在四川大学华西医院胸外科开展全科下游任务验证。"
tags = ["基座模型", "医学AI"]

